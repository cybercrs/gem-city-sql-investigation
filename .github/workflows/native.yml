name: Native browser validation
on:
  push:
    branches: [rollout/native-browser]
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test native/tests/*.test.mjs
      - run: python native/export.py && git diff --exit-code -- native/content.js native/original.css native/tests/python-oracles.json
      - run: python native/build.py
      - run: find native -name '*.js' -not -path '*/dist/*' -exec node --check {} \;
