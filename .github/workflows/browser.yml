name: Browser validation
on:
  push:
    branches: [rollout/stlite-browser-navigation]
  workflow_dispatch:
jobs:
  browser-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install streamlit==1.57.0 pandas==2.3.3
      - run: python -m unittest discover -s tests -v
      - run: python -m browser.test_app
      - run: python -m browser.build
      - run: python -m compileall -q browser
